<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>给琳浩的情书</title>
  <style>
    :root {
      --ink: #332015;
      --paper: #ead4a7;
      --paper-light: #f7e9c8;
      --paper-deep: #c49c63;
      --red: #b84634;
      --red-deep: #85281d;
      --seal: #9b2d24;
      --blue: #326187;
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --ease-smooth: cubic-bezier(.65, 0, .35, 1);
      --hand: "HanziPen SC", "Xingkai SC", "STXingkai", "KaiTi", "STKaiti", "Kaiti SC", "Songti SC", cursive;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #25150d;
      color: var(--ink);
      font-family: "Songti SC", "STSong", "SimSun", serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 51% 48%, rgba(255, 218, 156, .26), transparent 27%),
        radial-gradient(circle at 14% 28%, rgba(246, 191, 122, .08), transparent 24%),
        radial-gradient(circle at 82% 72%, rgba(255, 226, 176, .08), transparent 22%),
        linear-gradient(145deg, #674024 0%, #321b10 48%, #150b07 100%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .33;
      background:
        repeating-linear-gradient(90deg, rgba(255,255,255,.016) 0 1px, transparent 1px 5px),
        repeating-linear-gradient(0deg, rgba(0,0,0,.024) 0 1px, transparent 1px 8px);
      mix-blend-mode: overlay;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100dvh;
      min-height: 640px;
      display: grid;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
    }

    .warm-light {
      position: fixed;
      width: 88vmin;
      height: 88vmin;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 214, 148, .24), rgba(255, 214, 148, .07) 39%, transparent 70%);
      filter: blur(22px);
      pointer-events: none;
      z-index: 0;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      perspective: 1800px;
      z-index: 1;
    }

    .title {
      position: fixed;
      top: max(22px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 80;
      color: rgba(255, 242, 218, .82);
      font-family: var(--hand);
      font-size: clamp(15px, 1.6vw, 20px);
      letter-spacing: .28em;
      text-indent: .28em;
      user-select: none;
      transition: opacity .8s var(--ease-out), transform .8s var(--ease-out);
    }

    .opened .title {
      opacity: .34;
      transform: translateX(-50%) translateY(-10px);
    }

    .reader {
      position: absolute;
      z-index: 18;
      width: min(72vw, 660px, calc((100dvh - 132px) * .75));
      aspect-ratio: 3 / 4;
      transform-style: preserve-3d;
      transform: translateY(18vh) scale(.34) rotateX(9deg);
      opacity: 0;
      filter: drop-shadow(0 36px 48px rgba(0,0,0,.48));
      transition:
        transform 1.36s var(--ease-out),
        opacity 1s var(--ease-out),
        filter .8s var(--ease-out);
      cursor: pointer;
      pointer-events: none;
    }

    .opened .reader {
      opacity: 1;
      transform: translateY(-3vh) scale(1) rotateX(0deg);
      pointer-events: auto;
      transition-delay: .54s;
    }

    .returning .reader {
      opacity: 0;
      transform: translateY(18vh) scale(.34) rotateX(9deg);
      transition-delay: 0s;
    }

    .page {
      position: absolute;
      inset: 0;
      border-radius: 7px;
      overflow: hidden;
      backface-visibility: hidden;
      transform-origin: 50% 55%;
      background: #e9d1a3;
      box-shadow:
        0 30px 50px rgba(0,0,0,.36),
        inset 0 0 0 1px rgba(102, 62, 24, .18);
      transition:
        opacity .54s var(--ease-smooth),
        transform .72s var(--ease-smooth),
        filter .54s var(--ease-smooth);
    }

    .page img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    .page-one {
      opacity: 1;
      transform: translateX(0) rotateY(0deg) scale(1);
      z-index: 2;
    }

    .page-two {
      opacity: 0;
      transform: translateX(7%) rotateY(-12deg) scale(.965);
      filter: blur(.25px) brightness(.92);
      z-index: 1;
    }

    .reader.show-two .page-one {
      opacity: 0;
      transform: translateX(-7%) rotateY(12deg) scale(.965);
      filter: blur(.25px) brightness(.92);
      z-index: 1;
    }

    .reader.show-two .page-two {
      opacity: 1;
      transform: translateX(0) rotateY(0deg) scale(1);
      filter: none;
      z-index: 2;
    }

    .envelope-wrap {
      position: absolute;
      z-index: 40;
      width: min(78vw, 760px);
      aspect-ratio: 1.62;
      transform-style: preserve-3d;
      transform: translateY(12px) scale(1) rotate(-1.2deg);
      filter: drop-shadow(0 32px 48px rgba(0,0,0,.46));
      transition:
        transform 1.32s var(--ease-out),
        opacity .9s var(--ease-out),
        filter .9s var(--ease-out),
        z-index .01s linear .9s;
    }

    .opened .envelope-wrap {
      z-index: 8;
      opacity: .82;
      transform: translateY(34vh) scale(.72) rotate(-2.8deg) rotateX(7deg);
      filter: drop-shadow(0 20px 24px rgba(0,0,0,.30));
      pointer-events: none;
    }

    .returning .envelope-wrap {
      z-index: 44;
      opacity: 1;
      transform: translateY(12px) scale(1) rotate(-1.2deg);
      pointer-events: auto;
    }

    .envelope {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
    }

    .env-back,
    .env-front,
    .env-flap,
    .env-left,
    .env-right {
      position: absolute;
      inset: 0;
      border-radius: 8px;
    }

    .env-back {
      background:
        radial-gradient(circle at 20% 26%, rgba(112, 72, 29, .14), transparent 22%),
        radial-gradient(circle at 82% 74%, rgba(95, 57, 24, .13), transparent 18%),
        linear-gradient(180deg, #f4e2bd 0%, #d8b47d 100%);
      box-shadow:
        inset 0 0 0 1px rgba(97, 55, 19, .24),
        inset 0 0 42px rgba(82, 46, 18, .13);
      transform: translateZ(-5px);
      overflow: hidden;
    }

    .env-back::before {
      content: "";
      position: absolute;
      inset: 22px;
      border: 2px solid rgba(181, 68, 54, .76);
      box-shadow: inset 0 0 0 1px rgba(181, 68, 54, .32);
      border-radius: 3px;
    }

    .env-back::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent 48%, rgba(255,255,255,.2) 49%, rgba(78, 47, 20, .13) 50%, transparent 53%),
        linear-gradient(180deg, transparent 52%, rgba(73, 45, 19, .12) 53%, rgba(255,255,255,.12) 54%, transparent 56%),
        repeating-linear-gradient(0deg, rgba(70, 42, 18, .025) 0 1px, transparent 1px 7px);
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .env-flap {
      transform-origin: 50% 0%;
      clip-path: polygon(0 0, 100% 0, 50% 57%);
      background:
        linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0) 46%),
        linear-gradient(160deg, #f5e4c2 0%, #d0aa73 100%);
      box-shadow: inset 0 -2px 0 rgba(131, 82, 34, .16);
      transform: translateZ(14px) rotateX(0deg);
      transition: transform 1.04s var(--ease-out) .12s;
      z-index: 7;
    }

    .opened .env-flap {
      transform: translateZ(14px) rotateX(154deg);
    }

    .returning .env-flap {
      transform: translateZ(14px) rotateX(0deg);
    }

    .env-left {
      clip-path: polygon(0 0, 53% 50%, 0 100%);
      background: linear-gradient(120deg, rgba(255,255,255,.16), rgba(209, 169, 107,.96));
      transform: translateZ(10px);
      z-index: 5;
    }

    .env-right {
      clip-path: polygon(100% 0, 47% 50%, 100% 100%);
      background: linear-gradient(240deg, rgba(255,255,255,.13), rgba(197, 151, 88,.97));
      transform: translateZ(10px);
      z-index: 5;
    }

    .env-front {
      background:
        radial-gradient(circle at 17% 20%, rgba(123, 78, 32, .13), transparent 18%),
        radial-gradient(circle at 80% 72%, rgba(92, 53, 20, .12), transparent 18%),
        linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0) 36%),
        linear-gradient(180deg, #ead2a7 0%, #d1aa70 100%);
      clip-path: polygon(0 31%, 50% 64%, 100% 31%, 100% 100%, 0 100%);
      transform: translateZ(18px);
      z-index: 12;
      box-shadow: inset 0 0 0 1px rgba(96, 57, 22, .18);
    }

    .airmail {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      border-radius: 8px;
      opacity: .8;
      transform: translateZ(22px);
      z-index: 17;
    }

    .airmail::before,
    .airmail::after {
      content: "";
      position: absolute;
      background: repeating-linear-gradient(135deg,
        var(--red) 0 15px,
        transparent 15px 24px,
        var(--blue) 24px 39px,
        transparent 39px 48px);
    }

    .airmail::before {
      left: 18px;
      right: 18px;
      bottom: 14px;
      height: 9px;
      border-radius: 99px;
    }

    .airmail::after {
      top: 18px;
      bottom: 18px;
      left: 14px;
      width: 9px;
      background: repeating-linear-gradient(45deg,
        var(--red) 0 15px,
        transparent 15px 24px,
        var(--blue) 24px 39px,
        transparent 39px 48px);
      border-radius: 99px;
    }

    .cover-card {
      position: absolute;
      inset: 24px 34px 26px;
      transform: translateZ(26px);
      z-index: 18;
      border: 1.6px solid rgba(166, 59, 45, .62);
      background:
        linear-gradient(90deg, transparent 0 49.5%, rgba(133,40,29,.08) 49.5% 50.5%, transparent 50.5% 100%),
        repeating-linear-gradient(90deg, rgba(180,70,52,.16) 0 1px, transparent 1px 38px),
        rgba(251, 238, 205, .54);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.28);
      overflow: hidden;
    }

    .cover-card::before {
      content: "僑批";
      position: absolute;
      right: 28px;
      top: 22px;
      writing-mode: vertical-rl;
      font-family: var(--hand);
      color: rgba(125, 45, 34, .62);
      font-size: 22px;
      letter-spacing: .18em;
    }

    .center-ribbon {
      position: absolute;
      top: -18px;
      bottom: -18px;
      left: 47%;
      width: 98px;
      transform: translateX(-50%) rotate(-1.8deg);
      background:
        linear-gradient(90deg, rgba(255,255,255,.14), transparent 22%, transparent 76%, rgba(74, 20, 15, .12)),
        linear-gradient(180deg, rgba(255, 119, 96, .92), rgba(181, 52, 40, .95) 48%, rgba(132, 35, 28, .96));
      box-shadow:
        0 0 0 1px rgba(125, 31, 24, .14),
        inset 0 0 22px rgba(255,255,255,.16);
    }

    .cover-title {
      position: absolute;
      left: 47%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(-1.8deg);
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-family: var(--hand);
      color: rgba(30, 20, 14, .91);
      font-size: clamp(56px, 9vw, 92px);
      line-height: 1;
      letter-spacing: .05em;
      text-shadow:
        .8px .8px 0 rgba(70, 20, 12, .20),
        0 0 1px rgba(0,0,0,.22);
      z-index: 3;
    }

    .recipient {
      position: absolute;
      left: 13%;
      top: 23%;
      writing-mode: vertical-rl;
      font-family: var(--hand);
      color: rgba(62, 36, 21, .82);
      font-size: clamp(19px, 2.7vw, 27px);
      letter-spacing: .10em;
      line-height: 1.8;
      transform: rotate(.5deg);
    }

    .sender {
      position: absolute;
      right: 18%;
      bottom: 16%;
      writing-mode: vertical-rl;
      font-family: var(--hand);
      color: rgba(62, 36, 21, .66);
      font-size: clamp(14px, 2vw, 20px);
      letter-spacing: .12em;
      line-height: 1.6;
    }

    .stamp {
      position: absolute;
      right: 11%;
      bottom: 13%;
      width: 68px;
      height: 68px;
      border: 2px solid rgba(151, 45, 35, .55);
      border-radius: 50%;
      display: grid;
      place-items: center;
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-family: var(--hand);
      font-size: 15px;
      color: rgba(151, 45, 35, .58);
      transform: rotate(-10deg);
      mix-blend-mode: multiply;
    }

    .stamp::after {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(151,45,35,.34);
      border-radius: 50%;
    }

    .cover-kapok {
      position: absolute;
      left: 28px;
      bottom: 14px;
      width: 88px;
      height: 88px;
      opacity: .88;
      transform: rotate(-15deg);
      filter: drop-shadow(0 6px 8px rgba(55, 22, 8, .16));
    }

    .open-panel {
      position: fixed;
      left: 50%;
      bottom: max(34px, calc(env(safe-area-inset-bottom) + 26px));
      transform: translateX(-50%);
      z-index: 70;
      display: flex;
      gap: 12px;
      transition: opacity .55s var(--ease-out), transform .55s var(--ease-out);
    }

    .opened .open-panel {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(12px);
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(255,255,255,.30);
      border-radius: 999px;
      padding: 12px 26px;
      background:
        linear-gradient(180deg, rgba(255, 240, 210, .36), rgba(255, 225, 176, .18));
      color: rgba(255, 245, 226, .95);
      font-family: var(--hand);
      font-size: 17px;
      letter-spacing: .08em;
      cursor: pointer;
      backdrop-filter: blur(12px);
      box-shadow:
        0 12px 28px rgba(0,0,0,.24),
        inset 0 0 0 1px rgba(255,255,255,.10);
      transition: transform .22s ease, background .22s ease, opacity .22s ease;
      user-select: none;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(1px) scale(.98); }
    .btn:disabled { opacity: .34; cursor: not-allowed; transform: none; }

    .btn.primary {
      background:
        linear-gradient(180deg, rgba(183, 70, 52, .82), rgba(122, 43, 31, .88));
      border-color: rgba(255, 216, 185, .34);
      color: #fff1dc;
      min-width: 176px;
    }

    .toolbar {
      position: fixed;
      left: 50%;
      bottom: max(24px, calc(env(safe-area-inset-bottom) + 18px));
      transform: translateX(-50%) translateY(22px);
      z-index: 68;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .64s var(--ease-out), transform .64s var(--ease-out);
    }

    .opened .toolbar {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
      transition-delay: .9s;
    }

    .returning .toolbar {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(22px);
      transition-delay: 0s;
    }

    .btn.secondary {
      font-size: 14px;
      padding: 9px 15px;
      letter-spacing: .05em;
      background: rgba(255, 238, 204, .18);
    }

    .btn.put-back {
      color: #ffe6d2;
      border-color: rgba(255, 190, 164, .34);
    }

    .page-index {
      min-width: 62px;
      text-align: center;
      color: rgba(255, 245, 226, .88);
      font-family: "Georgia", serif;
      font-size: 13px;
      letter-spacing: .14em;
      user-select: none;
    }

    .hint {
      position: fixed;
      right: 24px;
      bottom: max(24px, calc(env(safe-area-inset-bottom) + 18px));
      z-index: 50;
      color: rgba(255, 241, 217, .54);
      font-size: 12px;
      letter-spacing: .08em;
      opacity: 0;
      transition: opacity .7s var(--ease-out);
      user-select: none;
    }

    .opened .hint { opacity: .72; transition-delay: 1.2s; }
    .returning .hint { opacity: 0; transition-delay: 0s; }

    .music-tip {
      position: fixed;
      right: 24px;
      top: max(24px, env(safe-area-inset-top));
      z-index: 50;
      color: rgba(255, 241, 217, .62);
      font-size: 12px;
      letter-spacing: .08em;
      user-select: none;
      opacity: .82;
      transition: opacity .7s var(--ease-out);
    }

    .opened .music-tip { opacity: .52; }

    .toast {
      position: fixed;
      left: 50%;
      top: max(64px, calc(env(safe-area-inset-top) + 54px));
      transform: translateX(-50%) translateY(-8px);
      z-index: 100;
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(44, 24, 13, .68);
      color: rgba(255, 244, 224, .92);
      font-size: 13px;
      letter-spacing: .04em;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(12px);
      transition: opacity .28s ease, transform .28s ease;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .dust-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0;
      z-index: 2;
      transition: opacity 1s var(--ease-out);
    }

    .opened .dust-layer { opacity: 1; }

    .dust {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(255, 233, 188, .72);
      box-shadow: 0 0 8px rgba(255, 233, 188, .38);
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      from { transform: translate3d(0, 8vh, 0); }
      to { transform: translate3d(18px, -118vh, 0); }
    }


    /* v4 cover replacement */
    .env-back,
    .env-front,
    .env-flap,
    .env-left,
    .env-right,
    .airmail,
    .cover-card {
      display: none;
    }

    .envelope-wrap {
      width: min(72vw, 620px, calc((100dvh - 170px) * 1.16));
      aspect-ratio: 4 / 3;
      transform: translateY(10px) scale(1) rotate(-1.4deg);
    }

    .opened .envelope-wrap {
      z-index: 8;
      opacity: .84;
      transform: translateY(31vh) scale(.82) rotate(-3deg) rotateX(6deg);
      filter: drop-shadow(0 20px 24px rgba(0,0,0,.30));
      pointer-events: none;
    }

    .envelope {
      overflow: visible;
    }

    .cover-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 10px;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      transform: translateZ(18px) rotate(0deg);
      transform-origin: 50% 62%;
      box-shadow: 0 26px 40px rgba(0, 0, 0, .34);
      transition: transform 1.08s var(--ease-out), opacity .84s var(--ease-out), filter .84s var(--ease-out);
    }

    .opened .cover-photo {
      transform: translateY(8px) translateZ(4px) rotate(-1.2deg) scale(.992);
      opacity: .96;
      filter: saturate(.96) brightness(.98);
    }

    .returning .cover-photo {
      transform: translateZ(18px) rotate(0deg) scale(1);
      opacity: 1;
      filter: none;
    }

    @media (max-width: 880px) {
      .envelope-wrap { width: min(82vw, 560px, calc((100dvh - 180px) * 1.12)); }
    }

    @media (max-width: 520px) {
      .envelope-wrap { width: 92vw; }
    }

    @media (max-width: 880px) {
      .app { min-height: 600px; }
      .envelope-wrap { width: min(90vw, 620px); }
      .reader { width: min(94vw, calc((100dvh - 146px) * .75)); }
      .opened .reader { transform: translateY(-4vh) scale(1); }
      .toolbar { gap: 7px; bottom: max(14px, calc(env(safe-area-inset-bottom) + 12px)); flex-wrap: wrap; justify-content: center; width: calc(100vw - 18px); }
      .btn { font-size: 15px; padding: 11px 18px; }
      .btn.secondary { padding: 8px 11px; }
      .hint { display: none; }
      .music-tip { display: none; }
      .cover-title { font-size: 56px; }
      .recipient { font-size: 21px; }
      .stamp { width: 56px; height: 56px; font-size: 13px; }
    }

    @media (max-width: 520px) {
      .title { top: 16px; }
      .envelope-wrap { width: 94vw; }
      .cover-card { inset: 20px 24px 24px; }
      .center-ribbon { width: 76px; }
      .cover-title { font-size: 44px; }
      .recipient { left: 10%; font-size: 18px; }
      .sender { right: 13%; font-size: 14px; }
      .cover-kapok { width: 68px; height: 68px; }
      .page-index { min-width: 46px; font-size: 12px; }
      .btn.secondary { font-size: 12px; padding: 8px 9px; }
      .btn.primary { min-width: 158px; }
    }


    /* v6 animation and perspective refinements */
    .reader::before,
    .reader::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 7px;
      background: linear-gradient(180deg, #f3e6c8 0%, #ead6aa 100%);
      box-shadow:
        0 20px 34px rgba(0,0,0,.22),
        inset 0 0 0 1px rgba(102, 62, 24, .10);
      pointer-events: none;
      transition:
        transform 1.12s var(--ease-out),
        opacity .9s var(--ease-out),
        filter .9s var(--ease-out);
    }

    .reader::before {
      opacity: .0;
      transform: translate3d(0, 54px, -32px) rotate(-4.2deg) scale(.94);
      filter: blur(.3px) brightness(.96);
    }

    .reader::after {
      opacity: .0;
      transform: translate3d(0, 34px, -18px) rotate(3.2deg) scale(.97);
      filter: blur(.18px) brightness(.985);
    }

    .opened .reader::before {
      opacity: .56;
      transform: translate3d(-16px, 14px, -26px) rotate(-4.8deg) scale(.985);
    }

    .opened .reader::after {
      opacity: .72;
      transform: translate3d(14px, 8px, -12px) rotate(3.8deg) scale(.992);
    }

    .returning .reader::before,
    .returning .reader::after {
      opacity: 0;
      transform: translate3d(0, 56px, -34px) rotate(0deg) scale(.94);
    }

    .reader {
      width: min(72vw, 660px, calc((100dvh - 132px) * .75));
      transform: translateY(20vh) scale(.30) rotateX(11deg) rotate(-1.2deg);
      transition:
        transform 1.46s cubic-bezier(.18,.9,.2,1),
        opacity 1.02s var(--ease-out),
        filter .88s var(--ease-out);
    }

    .opened .reader {
      transform: translateY(-4.6vh) scale(1) rotateX(0deg) rotate(.2deg);
      transition-delay: .18s;
      filter: drop-shadow(0 42px 56px rgba(0,0,0,.46));
    }

    .returning .reader {
      transform: translateY(19vh) scale(.34) rotateX(11deg) rotate(-1deg);
    }

    .envelope-wrap {
      transform: translateY(12px) rotate(-6.2deg) rotateX(2deg) scale(1);
      transform-origin: 48% 62%;
      transition:
        transform 1.36s cubic-bezier(.22,.88,.24,1),
        opacity .92s var(--ease-out),
        filter .92s var(--ease-out),
        z-index .01s linear .9s;
    }

    .opened .envelope-wrap {
      opacity: .88;
      transform: translateY(33vh) rotate(-7.4deg) rotateX(9deg) scale(.83);
      filter: drop-shadow(0 18px 22px rgba(0,0,0,.26));
    }

    .returning .envelope-wrap {
      transform: translateY(12px) rotate(-6.2deg) rotateX(2deg) scale(1);
    }

    .cover-photo {
      border-radius: 8px;
      transform: translateZ(18px) rotate(-1.8deg) perspective(1200px) rotateX(1.2deg);
      transform-origin: 48% 58%;
      box-shadow: 0 34px 44px rgba(0, 0, 0, .34);
      transition: transform 1.14s cubic-bezier(.22,.88,.24,1), opacity .88s var(--ease-out), filter .88s var(--ease-out);
    }

    .opened .cover-photo {
      transform: translateY(14px) translateZ(4px) rotate(-3.2deg) perspective(1200px) rotateX(6deg) scale(.992);
      opacity: .98;
      filter: saturate(.97) brightness(.985);
    }

    .returning .cover-photo {
      transform: translateZ(18px) rotate(-1.8deg) perspective(1200px) rotateX(1.2deg) scale(1);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <div class="warm-light"></div>
    <div class="dust-layer" id="dustLayer"></div>
    <div class="toast" id="toast">已开启音乐，可调高系统音量</div>
    <div class="title">给琳浩的一封情书</div>

    <section class="stage" aria-label="互动情书侨批">
      <div class="reader" id="reader" aria-live="polite" title="点击翻页">
        <article class="page page-two" aria-label="情书第二页">
          <img src="assets/letter-page-2.webp" alt="情书第二页" loading="lazy" decoding="async" />
        </article>
        <article class="page page-one" aria-label="情书第一页">
          <img src="assets/letter-page-1.webp" alt="情书第一页" loading="lazy" decoding="async" />
        </article>
      </div>

      <div class="envelope-wrap" id="envelopeWrap" aria-label="未拆开的情书信封">
        <div class="envelope">
          <div class="env-back"></div>
          <div class="env-flap"></div>
          <div class="env-left"></div>
          <div class="env-right"></div>
          <div class="env-front"></div>
          <div class="airmail"></div>
          <div class="cover-card">
            <div class="center-ribbon"></div>
            <div class="cover-title">情書</div>
            <div class="recipient">琳浩吾妻<br>親啟</div>
            <div class="sender">文彬謹寄</div>
            <div class="stamp">平安</div>
            <svg class="cover-kapok" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <radialGradient id="kapokPetalV3" cx="50%" cy="40%" r="68%">
                  <stop offset="0" stop-color="#ffb09b"/>
                  <stop offset=".48" stop-color="#e34c34"/>
                  <stop offset="1" stop-color="#9f251a"/>
                </radialGradient>
                <radialGradient id="kapokCoreV3" cx="50%" cy="50%" r="58%">
                  <stop offset="0" stop-color="#f7cc79"/>
                  <stop offset="1" stop-color="#8e4c17"/>
                </radialGradient>
              </defs>
              <g transform="translate(62 60)">
                <ellipse cx="0" cy="-26" rx="14" ry="30" fill="url(#kapokPetalV3)" transform="rotate(0)"/>
                <ellipse cx="0" cy="-26" rx="14" ry="30" fill="url(#kapokPetalV3)" transform="rotate(72)"/>
                <ellipse cx="0" cy="-26" rx="14" ry="30" fill="url(#kapokPetalV3)" transform="rotate(144)"/>
                <ellipse cx="0" cy="-26" rx="14" ry="30" fill="url(#kapokPetalV3)" transform="rotate(216)"/>
                <ellipse cx="0" cy="-26" rx="14" ry="30" fill="url(#kapokPetalV3)" transform="rotate(288)"/>
                <circle cx="0" cy="0" r="11" fill="url(#kapokCoreV3)"/>
                <circle cx="0" cy="0" r="4" fill="#6e3512"/>
              </g>
              <path d="M20 108 C42 94, 70 96, 106 118" fill="none" stroke="#78512a" stroke-width="4" stroke-linecap="round"/>
            </svg>
          </div>
          <img class="cover-photo" src="assets/cover-photo.webp" alt="情書封面" decoding="async" fetchpriority="high" />
        </div>
      </div>
    </section>

    <div class="open-panel">
      <button class="btn primary" id="openBtn" type="button">拆信并播放音乐</button>
    </div>

    <div class="hint">点击信纸本身也可以翻页</div>

    <nav class="toolbar" aria-label="情书翻页控制">
      <button class="btn secondary" id="prevBtn" type="button">上一页</button>
      <div class="page-index" id="pageIndex">1 / 2</div>
      <button class="btn secondary" id="nextBtn" type="button">下一页</button>
      <button class="btn secondary put-back" id="putBackBtn" type="button">放回信封</button>
      <button class="btn secondary" id="musicBtn" type="button">音乐关</button>
    </nav>

    <div class="music-tip">点击拆信后播放音乐；若未听到，可点“音乐开”或调高系统音量</div>
  </main>

    <audio id="bgmAudio" preload="none" loop playsinline webkit-playsinline>
    <source src="assets/bgm.m4a" type="audio/mp4" />
    <source src="assets/bgm.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const app = document.getElementById('app');
    const reader = document.getElementById('reader');
    const openBtn = document.getElementById('openBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const putBackBtn = document.getElementById('putBackBtn');
    const pageIndex = document.getElementById('pageIndex');
    const musicBtn = document.getElementById('musicBtn');
    const dustLayer = document.getElementById('dustLayer');
    const toast = document.getElementById('toast');

    let opened = false;
    let currentPage = 1;
    let musicOn = true;
    let toastTimer = null;
    const bgmAudio = document.getElementById('bgmAudio');

    if (bgmAudio) {
      bgmAudio.volume = 0.62;
    }

    function createDust() {
      for (let i = 0; i < 38; i++) {
        const dot = document.createElement('i');
        dot.className = 'dust';
        dot.style.left = `${Math.random() * 100}vw`;
        dot.style.top = `${88 + Math.random() * 28}vh`;
        dot.style.animationDuration = `${9 + Math.random() * 12}s`;
        dot.style.animationDelay = `${Math.random() * 8}s`;
        dot.style.opacity = `${0.18 + Math.random() * 0.46}`;
        dustLayer.appendChild(dot);
      }
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    async function startMusic(announce = false) {
      if (!musicOn || !bgmAudio) return;
      try {
        bgmAudio.volume = 0.62;
        await bgmAudio.play();
        musicBtn.textContent = '音乐关';
        if (announce) showToast('已开启音乐，可调高系统音量');
      } catch (err) {
        musicBtn.textContent = '音乐开';
        showToast('音乐未成功播放，请点“音乐开”再试一次');
      }
    }

    function stopMusic() {
      musicOn = false;
      musicBtn.textContent = '音乐开';
      if (bgmAudio) bgmAudio.pause();
    }

    async function resumeMusic() {
      musicOn = true;
      musicBtn.textContent = '音乐关';
      await startMusic(true);
    }

    function updatePage() {
      reader.classList.toggle('show-two', currentPage === 2);
      pageIndex.textContent = `${currentPage} / 2`;
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === 2;
    }

    async function openLetter() {
      if (opened) return;
      opened = true;
      app.classList.remove('returning');
      app.classList.add('opened');
      currentPage = 1;
      updatePage();
      await startMusic(true);
    }

    function putBackLetter() {
      if (!opened) return;
      currentPage = 1;
      updatePage();
      app.classList.add('returning');
      app.classList.remove('opened');
      setTimeout(() => {
        opened = false;
        app.classList.remove('returning');
      }, 980);
    }

    openBtn.addEventListener('click', openLetter);

    nextBtn.addEventListener('click', () => {
      if (!opened || currentPage === 2) return;
      currentPage = 2;
      updatePage();
    });

    prevBtn.addEventListener('click', () => {
      if (!opened || currentPage === 1) return;
      currentPage = 1;
      updatePage();
    });

    putBackBtn.addEventListener('click', putBackLetter);

    reader.addEventListener('click', () => {
      if (!opened) return;
      currentPage = currentPage === 1 ? 2 : 1;
      updatePage();
    });

    musicBtn.addEventListener('click', async () => {
      if (musicOn) stopMusic();
      else await resumeMusic();
    });

    document.addEventListener('keydown', (event) => {
      if (!opened) return;
      if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
        currentPage = currentPage === 1 ? 2 : 1;
        updatePage();
      }
      if (event.key === 'Escape') putBackLetter();
    });

    createDust();
    updatePage();
  </script>
</body>
</html>
